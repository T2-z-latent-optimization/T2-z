training:
  dataset_base_path: ${T2Z_REPO_ROOT}/datasets/real_stick/data
  dataset_metadata_path: ${T2Z_REPO_ROOT}/datasets/real_stick/train.jsonl
  dataset_repeat: 1
  dataset_num_workers: 0
  data_file_keys: video,action
  height: 192
  width: 256
  max_pixels: 16777216
  num_frames: 33
  frame_stride: 3
  resize_mode: letterbox
  num_history_frames: 1
  time_division_factor: 4
  time_division_remainder: 1
  spatial_division_factor: 32
  chunk_mode: static
  pad_short_chunks: true
  model_paths: models/Wan2.2-TI2V-5B
  model_id_with_origin_paths: null
  extra_inputs: null
  fp8_models: null
  offload_models: null
  model_config_path: configs/model/wan2_2_ti2v_5b.yaml
  initialize_model_on_cpu: false
  text_mode: none
  enable_text: false
  enable_dit: true
  enable_vae: true
  enable_image: false
  action_mode: adaln
  action_type: eef_target
  action_stat_path: ${T2Z_REPO_ROOT}/datasets/real_stick/action_stats.json
  action_dim: 14
  physical_context_dim: 32
  physical_context_tokens: 1
  physical_context_hidden_dim: 128
  physical_context_init_std: 0
  physical_context_init_value: 0.0
  physical_adapter_mode: none
  physical_adapter_rank: 16
  physical_adapter_layers: all
  physical_adapter_gate_init: 0
  learning_rate: 1.0e-05
  num_epochs: 1
  find_unused_parameters: true
  weight_decay: 0.01
  task: sft
  seed: 20260916
  mixed_precision: bf16
  max_timestep_boundary: 1
  min_timestep_boundary: 0
  batch_size: 1
  remove_prefix_in_ckpt: pipe.dit.
  checkpoint_save_minutes: 100000
  checkpoint_keep_last: 2
  log_steps: 2
  ckpt_path: ckpt/BLM/step-12000.safetensors
  resume_from: null
  lora_base_model: null
  lora_target_modules: null
  lora_rank: 32
  lora_checkpoint: null
  preset_lora_path: null
  preset_lora_model: null
  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: false
  gradient_accumulation_steps: 1
  max_grad_norm: 0.5
  use_wandb: false
  use_swanlab: false
  swanlab_experiment_name: null
  video_light_augmentation_enabled: true
  video_light_augmentation_probability: 0.7
  video_light_augmentation_gradient_abs_max: 0.08
  video_light_augmentation_noise_std: 0.004
  physical_context_mode: none
  trainable_models: dit,action_encoder
  save_steps: 500
  output_path: ${T2Z_OUTPUT_ROOT}/real_stick/ttt
  canonical_target_eef: false
  stage1_warmup_steps: 100
  ttt_active_environment_manifest: ${T2Z_REPO_ROOT}/datasets/real_stick/environments.yaml
  ttt_environment_key: environment_index
  ttt_action_key: episode_index
  ttt_window_sampling_mode: uniform_episode_then_window
  ttt_window_kind_field: sampling_kind
  ttt_preferred_window_kind: lift
  ttt_preferred_window_probability: 0.7
  ttt_distinct_actions: true
  ttt_sequence_length: 8
  ttt_environments_per_rank: 3
  ttt_streams_per_environment: 1
  ttt_layers: uniform:8
  ttt_expansion: 4
  ttt_base_inner_lr: 0.1
  ttt_inner_batch_size: 64
  ttt_write_token_budget: 0
  ttt_gate_init: 0.1
  ttt_gate_vector: true
  ttt_serial_after_attention: true
  ttt_saved_tensor_cpu_offload: false
  ttt_protocol: write_then_predict
  ttt_slow_learning_rate: 0.0001
  ttt_max_updates: 5500
  ttt_saved_tensor_policy: default
  ttt_gpu_saved_tensor_budget_gib: 12.0
  ttt_backward_per_stream: true
  ttt_sync_per_update: true
  environment_sampling_scope: independent_rank
  checkpoint_policy: protected
  protected_checkpoint_steps: '2300'
  checkpoint_deadline_env: BWM_TTT_DEADLINE_EPOCH
t2z_task:
  name: real_stick
t2z_sampling:
  chunk_selection_mode: weighted
  trainable_chunk_field: trainable_chunk
  chunk_weight_field: chunk_weight

training:
  dataset_base_path: ${T2Z_REPO_ROOT}/datasets/real_door/data
  dataset_metadata_path: ${T2Z_REPO_ROOT}/datasets/real_door/train.jsonl
  dataset_repeat: 1
  dataset_num_workers: 0
  data_file_keys: video,action
  height: 192
  width: 256
  max_pixels: 16777216
  num_frames: 49
  frame_stride: 1
  resize_mode: letterbox
  num_history_frames: 1
  time_division_factor: 4
  time_division_remainder: 1
  spatial_division_factor: 32
  chunk_mode: static
  pad_short_chunks: true
  model_paths: models/Wan2.2-TI2V-5B
  model_id_with_origin_paths: null
  extra_inputs: null
  fp8_models: null
  offload_models: null
  model_config_path: configs/model/wan2_2_ti2v_5b.yaml
  initialize_model_on_cpu: false
  text_mode: none
  enable_text: false
  enable_dit: true
  enable_vae: true
  enable_image: false
  action_mode: adaln
  action_type: joint_target_export
  action_stat_path: ${T2Z_REPO_ROOT}/datasets/real_door/action_stats.json
  action_dim: 14
  physical_context_mode: both
  physical_context_dim: 32
  physical_context_tokens: 1
  physical_context_hidden_dim: 128
  physical_context_init_std: 0.0
  physical_context_init_value: 0.5
  physical_adapter_mode: none
  physical_adapter_rank: 16
  physical_adapter_layers: all
  physical_adapter_gate_init: 0.0
  learning_rate: 1.0e-05
  num_epochs: 1
  trainable_models: dit,action_encoder,physical_context_encoder
  find_unused_parameters: true
  weight_decay: 0.01
  task: sft
  seed: 20260909
  mixed_precision: bf16
  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0
  batch_size: 1
  output_path: ${T2Z_OUTPUT_ROOT}/real_door/dino
  remove_prefix_in_ckpt: pipe.dit.
  save_steps: 500
  checkpoint_save_minutes: 100000
  checkpoint_keep_last: 2
  log_steps: 2
  ckpt_path: ckpt/BLM/step-12000.safetensors
  resume_from: null
  lora_base_model: null
  lora_target_modules: null
  lora_rank: 32
  lora_checkpoint: null
  preset_lora_path: null
  preset_lora_model: null
  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: false
  gradient_accumulation_steps: 1
  max_grad_norm: 0.5
  use_wandb: false
  use_swanlab: false
  swanlab_experiment_name: null
  video_light_augmentation_enabled: true
  video_light_augmentation_probability: 0.7
  video_light_augmentation_gradient_abs_max: 0.08
  video_light_augmentation_noise_std: 0.004
  canonical_target_eef: false
  stage1_warmup_steps: 100
  physical_context_input_norm: layernorm
  dinov2_model_path: models/dinov2-base
  dinov2_active_environment_manifest: ${T2Z_REPO_ROOT}/datasets/real_door/environments.yaml
  dinov2_environment_key: environment_index
  dinov2_action_key: episode_index
  dinov2_distinct_actions: true
  dinov2_window_sampling_mode: uniform_episode_then_window
  dinov2_window_kind_field: sampling_kind
  dinov2_preferred_window_kind: precise
  dinov2_preferred_window_probability: 0.5
  dinov2_support_light_augmentation_enabled: true
  dinov2_sampled_frames: 8
  dinov2_temporal_stride: 4
  dinov2_hidden_dim: 256
  dinov2_action_hidden_dim: 128
  dinov2_output_dim: 32
  dinov2_aggregation_mode: concat_mlp
  dinov2_mlp_hidden_dim: 1024
  dinov2_support_k: 1
  dinov2_support_k_choices: 1,2
  dinov2_trajectories_per_environment: 8
  dinov2_environments_per_rank: 3
  dinov2_head_learning_rate: 0.0001
  dinov2_max_updates: 5500
  environment_sampling_scope: independent_rank
  checkpoint_policy: protected
  protected_checkpoint_steps: '2300'
  checkpoint_deadline_env: BWM_DINO_DEADLINE_EPOCH
t2z_task:
  name: real_door
t2z_sampling:
  chunk_selection_mode: weighted
  trainable_chunk_field: trainable_chunk
  chunk_weight_field: chunk_weight
